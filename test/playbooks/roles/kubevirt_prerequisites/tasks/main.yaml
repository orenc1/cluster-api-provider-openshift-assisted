---
- name: Wait for OpenShift Virtualization to become available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: kubevirt-operator
    namespace: openshift-cnv
  register: kubevirt_operator
  until: >-
    kubevirt_operator.resources[0].status.conditions |
    selectattr('type', 'equalto', 'Available') |
    selectattr('status', 'equalto', 'True') |
    list | length > 0
  retries: "{{ medium_retries | int }}"
  delay: "{{ medium_delay | int }}"

- name: Wait for the Containerized Data Importer deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cdi-apiserver
    namespace: openshift-cnv
  register: cdi_apiserver
  until: >-
    cdi_apiserver.resources[0].status.conditions |
    selectattr('type', 'equalto', 'Available') |
    selectattr('status', 'equalto', 'True') |
    list | length > 0
  retries: "{{ medium_retries | int }}"
  delay: "{{ medium_delay | int }}"

- name: Verify that the tenant storage class exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ kubevirt_storage_class }}"
  register: tenant_storage_class
  failed_when: tenant_storage_class.resources | length != 1
